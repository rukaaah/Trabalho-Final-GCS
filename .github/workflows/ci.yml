# ==============================================================================
# Arquivo de Integracao Continua (CI) - GitHub Actions
#
# RESPONSAVEL: Engenheiro de Qualidade - Yan Victor Gomes
#
# OBJETIVO:
# Este workflow protege a branch principal (main) contra quebras de codigo
# e falhas de padronizacao, conforme a Secao 4.5 do enunciado do trabalho.
# Ele e acionado automaticamente a cada push na main e a cada Pull Request
# aberto contra a main.
#
# O QUE ESTE FLUXO FAZ:
# 1. Prepara uma maquina virtual (Ubuntu) no servidor do GitHub.
# 2. Instala a versao do Python definida no projeto (3.10+).
# 3. Instala as bibliotecas do pyproject.toml (pytest, ruff, coverage).
# 4. Executa o linter (Ruff) para verificar a padronizacao do codigo.
# 5. Executa a suite de testes (Pytest) com geracao de relatorio de
#    cobertura (Coverage).
#
# REGRA DO PROJETO:
# Nenhum Pull Request deve ser mesclado na main com checks em vermelho.
# Testes e implementacao devem ser desenvolvidos e validados localmente
# (ou em branch de trabalho) antes da abertura do Pull Request contra a
# main. Cada Pull Request deve conter, juntos, o codigo e os testes que o
# validam, de modo que a CI permaneca verde no momento do merge.
# ==============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  qualidade:
    name: Lint e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias do projeto (modo dev)
        run: pip install -e ".[dev]"

      - name: Executar linter (Ruff)
        run: ruff check .

      - name: Executar suite de testes (Pytest + cobertura)
        run: pytest --cov=javalang --cov-report=term-missing
